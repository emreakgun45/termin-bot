name: Termin-Waechter

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten
  workflow_dispatch:          # manuell starten zum Testen

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Termin pruefen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AKTUELLER_TERMIN: "31.12.2026"
        run: python check_termin.py
